name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: mio_test
          POSTGRES_USER: mio
          POSTGRES_PASSWORD: mio-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mio -d mio_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: package.json
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Format
        run: pnpm format

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test
        env:
          # The db integration tests run against the service container here;
          # without this variable they fall back to Testcontainers.
          MIO_TEST_DATABASE_URL: postgres://mio:mio-ci-only@localhost:5432/mio_test

      - name: Architecture boundaries
        run: pnpm boundaries

      - name: Capability matrix - generated artifacts fresh
        run: pnpm --filter @mio/authz generate:check

      - name: Web build
        run: pnpm --filter @mio/web build
