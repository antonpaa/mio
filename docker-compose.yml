# Local development services (docs/architecture/platform.md).
# Postgres matches the managed-service major (ADR-0002); Mailpit catches
# every outbound email so the contentless-email rule is inspectable at
# http://localhost:8025 from the first invitation onward.
#
# Host ports are deliberately NOT the services' well-known ports:
# publishing Postgres on 5432 collides with whatever PostgreSQL a
# machine already runs (a native install, another project), and on
# Windows the high ephemeral range can be randomly reserved by
# Hyper-V/WSL2 - so the default is 15432, low and unclaimed by
# convention. Override any of them without editing this file by
# putting e.g. MIO_PG_PORT=25432 in a repo-root .env (gitignored;
# compose reads it automatically).
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: mio
      POSTGRES_USER: mio
      POSTGRES_PASSWORD: mio-local-only
    ports:
      - '${MIO_PG_PORT:-15432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U mio -d mio']
      interval: 5s
      timeout: 3s
      retries: 10

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - '${MIO_MAILPIT_SMTP_PORT:-1025}:1025'
      - '${MIO_MAILPIT_UI_PORT:-8025}:8025'

volumes:
  postgres-data:
