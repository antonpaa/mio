# Local development services (docs/architecture/platform.md).
# Postgres matches the managed-service major (ADR-0002); Mailpit catches
# every outbound email so the contentless-email rule is inspectable at
# http://localhost:8025 from the first invitation onward.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: mio
      POSTGRES_USER: mio
      POSTGRES_PASSWORD: mio-local-only
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U mio -d mio']
      interval: 5s
      timeout: 3s
      retries: 10

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - '1025:1025'
      - '8025:8025'

volumes:
  postgres-data:
