# WP-09: build -> migration gate -> deploy. Staging rolls from main;
# dev by hand. The gate is the point: a migration that cannot apply
# stops the deploy before any new code runs.
name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: environment to deploy
        type: choice
        options: [dev, staging]
        default: dev

concurrency:
  group: deploy-${{ github.event.inputs.environment || 'staging' }}
  cancel-in-progress: false

env:
  ENVIRONMENT: ${{ github.event.inputs.environment || 'staging' }}
  REGION: europe-north1

jobs:
  deploy:
    # skipped entirely until the repository is wired to a GCP project
    if: vars.GCP_PROJECT != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Configure docker for Artifact Registry
        run: gcloud auth configure-docker "$REGION-docker.pkg.dev" --quiet

      - name: Build and push images
        run: |
          REPO="$REGION-docker.pkg.dev/${{ vars.GCP_PROJECT }}/mio-$ENVIRONMENT"
          docker build -f apps/api/Dockerfile -t "$REPO/api:${{ github.sha }}" .
          docker build -f apps/worker/Dockerfile -t "$REPO/worker:${{ github.sha }}" .
          docker push "$REPO/api:${{ github.sha }}"
          docker push "$REPO/worker:${{ github.sha }}"

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Migration gate
        # forward-only migrations as mio_owner through the auth proxy;
        # any failure stops the rollout before new code serves traffic
        run: |
          curl -sSLo cloud-sql-proxy \
            "https://storage.googleapis.com/cloud-sql-connectors/cloud-sql-proxy/v2.14.1/cloud-sql-proxy.linux.amd64"
          chmod +x cloud-sql-proxy
          ./cloud-sql-proxy --port 6543 "${{ vars.GCP_SQL_CONNECTION }}" &
          sleep 3
          DATABASE_URL="$(gcloud secrets versions access latest --secret="mio-$ENVIRONMENT-database-url" \
            | sed -E 's#@[^:]+:5432#@127.0.0.1:6543#')" pnpm migrate

      - name: Roll services
        run: |
          REPO="$REGION-docker.pkg.dev/${{ vars.GCP_PROJECT }}/mio-$ENVIRONMENT"
          gcloud run services update "mio-$ENVIRONMENT-api" \
            --region "$REGION" --image "$REPO/api:${{ github.sha }}"
          gcloud run services update "mio-$ENVIRONMENT-worker" \
            --region "$REGION" --image "$REPO/worker:${{ github.sha }}"
